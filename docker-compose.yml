services:
  postgres:
    image: postgres:17-alpine
    container_name: uplix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uplix
      POSTGRES_PASSWORD: uplix
      POSTGRES_DB: uplix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uplix -d uplix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
